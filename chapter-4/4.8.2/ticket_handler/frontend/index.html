<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务台系统 - 用户请求处理</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>服务台系统</h1>
            <p>提交您的问题或请求，我们的团队将尽快为您处理</p>
        </header>

        <main>
            <section class="ticket-form">
                <h2>提交请求</h2>
                <form id="requestForm">
                    <div class="form-group">
                        <label for="userName">姓名 *</label>
                        <input type="text" id="userName" name="userName" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="userEmail">邮箱 *</label>
                        <input type="email" id="userEmail" name="userEmail" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="requestType">请求类型 *</label>
                        <select id="requestType" name="requestType" required>
                            <option value="">请选择类型</option>
                            <option value="technical">技术问题</option>
                            <option value="billing">账单查询</option>
                            <option value="account">账户问题</option>
                            <option value="feature">功能建议</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="priority">优先级</label>
                        <select id="priority" name="priority">
                            <option value="low">低</option>
                            <option value="medium" selected>中</option>
                            <option value="high">高</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="subject">主题 *</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="description">详细描述 *</label>
                        <textarea id="description" name="description" rows="6" placeholder="请详细描述您的问题或请求..." required></textarea>
                    </div>
                    
                    <button type="submit" class="submit-btn">提交请求</button>
                </form>
            </section>

            <section class="ticket-list">
                <h2>我的请求</h2>
                <div id="ticketTableContainer">
                    <table id="ticketTable">
                        <thead>
                            <tr>
                                <th>编号</th>
                                <th>主题</th>
                                <th>类型</th>
                                <th>状态</th>
                                <th>日期</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="ticketList">
                            <!-- 动态加载工单 -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
